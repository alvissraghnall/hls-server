[package]
name = "hls-server"
version = "0.1.0"
edition = "2024"

[dependencies]
aes = { version = "0.9.0", optional = true }
aes-gcm = { version = "0.10.3", optional = true }
cbc = { version = "0.2.0", optional = true }
chrono = "0.4.44"
hex = "0.4.3"
hex-literal = { version = "1.1.0", optional = true }
itertools = "0.14.0"

[features]
aes = ["dep:aes", "dep:cbc", "dep:aes-gcm", "dep:hex-literal"]

[dev-dependencies]
pretty_assertions = "1.4.0"